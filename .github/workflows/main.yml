name: Aggiornamento Giornaliero Prezzi Pokémon
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Verifica codice
      uses: actions/checkout@v4
      
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Installa Google Chrome sul Server
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Installa librerie Python e Selenium
      run: |
        pip install requests beautifulsoup4 selenium
        
    - name: Esegui lo Scraping con Browser Fantasma
      run: python scraper.py
      
    - name: Salva e pubblica il file dei prezzi
      run: |
        git config --global user.name 'Scraper Bot'
        git config --global user.email 'bot@scraper.com'
        git add prezzi_pokemon.json
        git commit -m "Aggiornamento automatico con aggiramento Cloudflare" || exit 0
        git push
